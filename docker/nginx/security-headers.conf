# Nagłówki bezpieczeństwa. Plik jest dołączany w każdym bloku, który sam ustawia nagłówki –
# nginx nie dziedziczy add_header z bloku nadrzędnego, gdy blok potomny ma własne.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# connect-src: własny adres oraz – dla panelu wskazującego inny serwer Core – wyłącznie połączenia szyfrowane.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
